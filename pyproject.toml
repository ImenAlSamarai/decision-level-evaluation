[project]
name = "decision-level-evaluation"
version = "1.0.0"
description = "Optimal-switching benchmark with a Bellman-optimal reference for value-aware evaluation of sequential language-model agents"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "statsmodels>=0.14", "matplotlib>=3.7"]
eval = ["anthropic>=0.30"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["optimal_switching*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
